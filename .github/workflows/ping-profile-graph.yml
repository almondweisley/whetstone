name: Ping profile activity graph

# After each push to the default branch, ask the profile repo
# (almondweisley/almondweisley) to redraw the contribution graph right away.
# Needs a repo secret PROFILE_DISPATCH_TOKEN (or GRAPH): a fine-grained token with
# "Contents: Read and write" on almondweisley/almondweisley only.

on:
  push:

jobs:
  ping:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger profile graph update
        env:
          TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN || secrets.GRAPH }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No PROFILE_DISPATCH_TOKEN or GRAPH secret set - skipping."
            exit 0
          fi
          sleep 15  # give GitHub a moment to count the new contribution
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/almondweisley/almondweisley/dispatches \
            -d '{"event_type":"push"}'
          echo "Profile graph update requested."
